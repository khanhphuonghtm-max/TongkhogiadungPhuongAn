<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Gia Dụng</title>

  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- HEADER -->
  <header class="bg-green-700 text-white p-5 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold">Kho Gia Dụng</h1>

      <input
        type="text"
        placeholder="Tìm sản phẩm..."
        class="px-4 py-2 rounded-lg text-black w-64"
      >
    </div>
  </header>

  <!-- BANNER -->
  <section class="bg-white">
    <div class="max-w-7xl mx-auto p-6">
      <div class="bg-green-600 rounded-2xl p-10 text-white">
        <h2 class="text-4xl font-bold mb-4">
          Đồ Gia Dụng Giá Tốt
        </h2>

        <p class="text-lg">
          Hàng chất lượng - Giá kho - Giao nhanh
        </p>
      </div>
    </div>
  </section>

  <!-- DANH MỤC -->
  <section class="max-w-7xl mx-auto p-6">

    <h2 class="text-2xl font-bold mb-5">
      Danh mục sản phẩm
    </h2>

    <div class="flex gap-4 flex-wrap mb-10">

      <button class="bg-green-600 text-white px-5 py-2 rounded-full">
        Nồi cơm điện
      </button>

      <button class="bg-white px-5 py-2 rounded-full shadow">
        Máy xay
      </button>

      <button class="bg-white px-5 py-2 rounded-full shadow">
        Quạt điện
      </button>

      <button class="bg-white px-5 py-2 rounded-full shadow">
        Gia dụng bếp
      </button>

    </div>

    <!-- SẢN PHẨM -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

      <!-- CARD -->
      <div class="bg-white rounded-2xl shadow hover:shadow-xl transition overflow-hidden">

        <img
          src="https://images.unsplash.com/photo-1586201375761-83865001e31c?q=80&w=800"
          class="w-full h-60 object-cover"
        >

        <div class="p-4">

          <h3 class="text-xl font-semibold mb-2">
            Nồi cơm điện Sharp
          </h3>

          <p class="text-gray-500 mb-3">
            Dung tích 1.8L
          </p>

          <div class="text-red-600 text-2xl font-bold">
            890.000đ
          </div>

        </div>

      </div>

      <!-- CARD -->
      <div class="bg-white rounded-2xl shadow hover:shadow-xl transition overflow-hidden">

        <img
          src="https://images.unsplash.com/photo-1570222094114-d054a817e56b?q=80&w=800"
          class="w-full h-60 object-cover"
        >

        <div class="p-4">

          <h3 class="text-xl font-semibold mb-2">
            Máy xay sinh tố
          </h3>

          <p class="text-gray-500 mb-3">
            Công suất mạnh
          </p>

          <div class="text-red-600 text-2xl font-bold">
            650.000đ
          </div>

        </div>

      </div>

      <!-- CARD -->
      <div class="bg-white rounded-2xl shadow hover:shadow-xl transition overflow-hidden">

        <img
          src="https://images.unsplash.com/photo-1585771724684-38269d6639fd?q=80&w=800"
          class="w-full h-60 object-cover"
        >

        <div class="p-4">

          <h3 class="text-xl font-semibold mb-2">
            Quạt điện mini
          </h3>

          <p class="text-gray-500 mb-3">
            Tiết kiệm điện
          </p>

          <div class="text-red-600 text-2xl font-bold">
            390.000đ
          </div>

        </div>

      </div>

      <!-- CARD -->
      <div class="bg-white rounded-2xl shadow hover:shadow-xl transition overflow-hidden">

        <img
          src="https://images.unsplash.com/photo-1556911220-bff31c812dba?q=80&w=800"
          class="w-full h-60 object-cover"
        >

        <div class="p-4">

          <h3 class="text-xl font-semibold mb-2">
            Bộ nồi inox
          </h3>

          <p class="text-gray-500 mb-3">
            Inox cao cấp
          </p>

          <div class="text-red-600 text-2xl font-bold">
            1.290.000đ
          </div>

        </div>

      </div>

    </div>

  </section>

</body>
</html>
